name: O RECOMECO - Gerar APK Android
on:
  workflow_dispatch:
  push:
    paths:
      - "project.godot"
      - "scenes/**"
      - "scripts/**"
      - "assets/**"
      - "export_presets.cfg"
      - ".github/workflows/android-apk.yml"
jobs:
  android:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.4
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4
      - name: Conferir arquivos essenciais
        run: |
          test -f project.godot
          test -f export_presets.cfg
          test -f scenes/main.tscn
          test -f scripts/Main.gd
      - name: Configurar modelos de exportacao
        run: |
          godot --version
          mkdir -p ~/.local/share/godot/export_templates
          ls -la ~/.local/share/godot/export_templates || true
      - name: Importar projeto e verificar erros
        run: godot --headless --path . --editor --quit
      - name: Exportar APK Android para teste
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android Debug" build/android/O_RECOMECO.apk
          test -s build/android/O_RECOMECO.apk
      - name: Disponibilizar instalador
        uses: actions/upload-artifact@v4
        with:
          name: O-RECOMECO-Android-APK-teste
          path: build/android/O_RECOMECO.apk
          if-no-files-found: error
          retention-days: 14
