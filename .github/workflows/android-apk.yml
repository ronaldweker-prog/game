name: RENASCER - APK Android de teste

on:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "scenes/**"
      - "scripts/**"
      - "assets/**"
      - "config/**"
      - "export_presets.cfg"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-android:
    name: Validar Godot e exportar Android ARM64
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.4
    defaults:
      run:
        shell: bash
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar templates, Android SDK, Java e assinatura de teste
        run: |
          set -euo pipefail
          echo "HOME=$HOME"
          godot --version
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config/godot"
          cp -a /root/.local/share/godot/export_templates/4.4.stable "$HOME/.local/share/godot/export_templates/"
          cp -a /root/.config/godot/. "$HOME/.config/godot/"
          test -s "$HOME/.local/share/godot/export_templates/4.4.stable/android_debug.apk"
          test -s /root/debug.keystore
          test -d /usr/lib/android-sdk
          test -f "$HOME/.config/godot/editor_settings-4.4.tres"
          echo "Ferramentas e templates configurados."
      - name: Criar icone do Android a partir da marca aprovada
        run: |
          set -euo pipefail
          godot --headless --path . --script res://scripts/tools/BuildIcon.gd
          test -s assets/app_icon.png
      - name: Adicionar texturas naturais CC0 ao APK
        run: |
          set -euo pipefail
          mkdir -p assets/materials
          if command -v python3 >/dev/null; then
            python3 scripts/tools/fetch_terrain.py
          elif command -v wget >/dev/null; then
            for asset in sand_03 grass_ground rock_ground; do
              target="assets/materials/${asset}_diff_1k.jpg"
              url="https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/${asset}/${asset}_diff_1k.jpg"
              if wget --quiet --timeout=35 --tries=2 --user-agent="RenascerNovoMundoGameBuild/0.3" -O "${target}" "${url}" && test "$(wc -c < "${target}")" -gt 35000; then
                echo "MATERIAL_FOTOGRAFICO_OK=${asset},bytes=$(wc -c < "${target}")"
              else
                rm -f "${target}"
                echo "MATERIAL_FOTOGRAFICO_FALLBACK=${asset}"
              fi
            done
          else
            echo "SEM_DOWNLOAD: materiais procedurais locais permanecem disponíveis."
          fi
      - name: Definir versao incremental do APK
        run: |
          set -euo pipefail
          sed -i "s|^version/code=.*|version/code=${GITHUB_RUN_NUMBER}|" export_presets.cfg
          sed -i "s|^version/name=.*|version/name=\"0.2.${GITHUB_RUN_NUMBER}\"|" export_presets.cfg
          grep -E '^version/(code|name)=' export_presets.cfg
      - name: Importar e validar projeto
        run: |
          set -euo pipefail
          test -f project.godot
          test -f scenes/main.tscn
          test -f scripts/Main.gd
          godot --headless --path . --editor --quit 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Error parsing' /tmp/import.log; then exit 1; fi
      - name: Testar abertura e scripts
        run: |
          set -euo pipefail
          godot --headless --path . --quit-after 8 2>&1 | tee /tmp/smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Error parsing' /tmp/smoke.log; then exit 1; fi
      - name: Testar inventario, construcao, camera e salvamento
        run: |
          set -euo pipefail
          godot --headless --path . --script res://scripts/tests/SmokeTests.gd 2>&1 | tee /tmp/integration.log
          if grep -E 'SCRIPT ERROR|Parse Error|FALHOU:|Error parsing' /tmp/integration.log; then exit 1; fi
      - name: Exportar APK Android
        run: |
          set -euo pipefail
          mkdir -p build/android
          godot --headless --path . --export-debug "Android Debug" build/android/RENASCER_NOVO_MUNDO.apk 2>&1 | tee /tmp/export.log
          test -s build/android/RENASCER_NOVO_MUNDO.apk
          unzip -tq build/android/RENASCER_NOVO_MUNDO.apk
          echo "APK gerado: $(du -h build/android/RENASCER_NOVO_MUNDO.apk)"
      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: RENASCER-NOVO-MUNDO-APK-Android
          path: build/android/RENASCER_NOVO_MUNDO.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publicar versao experimental para download direto
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-teste-${{ github.run_number }}
          name: "RENASCER: NOVO MUNDO — teste Android ${{ github.run_number }}"
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body: |
            APK experimental gerado automaticamente. Não representa o jogo completo.
            Ainda precisa ser testado em aparelho Android físico (POCO M7 Pro 5G).
            Mecanicas avançadas e gráficos finais permanecem em desenvolvimento.
          files: build/android/RENASCER_NOVO_MUNDO.apk
